# Project config layer for this repository (resolve_config.py layer 7, canonical
# "Seçenek A": {project-root}/docs/config.toml — project values WIN over plugin
# defaults).
#
# Why a project layer at all: the plugin's base config (bmad/config.toml) is
# shared by every install and must stay neutral — a real project name there
# leaks into other projects and renames their run folders
# (prd-{project_name}-{date}). Identity belongs here.
# Guarded by scripts/check-plugin.sh §0b and surfaced by orient.py when a
# project resolves to the neutral default.
[core]
project_name = "metodoloji"
