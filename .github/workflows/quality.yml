name: quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run Python test suite
        run: python -m pytest -q
      - name: Run plugin and record audits
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/check-plugin.sh
          sh scripts/check-custom.sh
          sh scripts/check-methodology.sh
          sh scripts/check-techdebt.sh
          python scripts/check-handoff.py
          python scripts/check-triggers.py

  opencode:
    name: OpenCode bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bridge dependencies
        working-directory: opencode-plugin
        run: npm ci --ignore-scripts
      - name: Run bridge tests
        working-directory: opencode-plugin
        run: npm test
