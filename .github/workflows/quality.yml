name: quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run Python test suite
        run: python -m pytest -q
      - name: Run plugin and record audits
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/check-plugin.sh
          sh scripts/check-custom.sh
          sh scripts/check-methodology.sh
          sh scripts/check-techdebt.sh
          python scripts/bench/bench_audit_binding.py
          python scripts/check-handoff.py
          python scripts/check-triggers.py
          python scripts/external-context.py check --project-root . --strict

  benches:
    # E-162: 43 benches shipped and this workflow ran exactly one of them, so
    # four benches stayed red for days after commit 2064fa9 emptied README,
    # LICENSE and SECURITY. An instrument nobody runs cannot report anything.
    # The population is derived by glob inside run_all.py, never listed here —
    # a new bench joins the gate by existing.
    name: Measurement benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run every shipped bench
        # E-167: the benches job sits beside the test job, which already runs
        # `pytest -q`. Two benches measure the whole suite as their own
        # measurement, so running them here too made one PR run the suite three
        # times. `--skip-full-suite` drops exactly those (derived from source,
        # never listed) and the dedicated test job keeps them honest.
        run: python scripts/bench/run_all.py --skip-full-suite

  windows:
    name: Windows Python 3.12 checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run Python test suite
        run: python -m pytest -q

  opencode:
    name: OpenCode bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bridge dependencies
        working-directory: opencode-plugin
        run: npm ci --ignore-scripts
      - name: Run bridge tests
        working-directory: opencode-plugin
        run: npm test
