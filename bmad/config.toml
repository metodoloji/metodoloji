# ─────────────────────────────────────────────────────────────────
# Installer-managed. Regenerated on every install — treat as read-only.
#
# Direct edits to this file will be overwritten on the next install.
# To change an install answer durably, re-run the installer (your prior
# answers are remembered as defaults). To pin a value regardless of
# install answers, or to add custom agents / override descriptors, use:
#   custom/config.toml       (team, committed)
#   custom/config.user.toml  (personal, gitignored)
# Those files are never touched by the installer.
# ─────────────────────────────────────────────────────────────────

[core]
# Neutral by design: this is the BASE layer every install inherits
# (resolve_config.py layer 1). A concrete project name here leaks into every
# target project and renames its run folders (prd-{project_name}-{date}) — see
# check-plugin.sh §0b. Set identity in the PROJECT layer instead:
# {project-root}/docs/config.toml.
project_name = "unconfigured"
document_output_language = "English"
output_folder = "{project-root}/docs"

[modules.bmm]
planning_artifacts = "{project-root}/docs/planning"
implementation_artifacts = "{project-root}/docs/development/native"
project_knowledge = "{project-root}/docs"

[modules.bmb]
bmad_builder_output_folder = "{project-root}/skills"
bmad_builder_reports = "{project-root}/skills/reports"

