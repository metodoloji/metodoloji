#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = [
  "Before starting this work, verify the gate rules of the relevant module in the methodology manifesto ({metodoloji-root}/docs/bmad/research-methodology.md): the evidence type and record format of the output to be produced.",
  "Before finishing the work, verify that the record is complete: English field labels, decision rationale, uncertainty acknowledgment. A documentary decision is not permission to write code.",
  "BRIDGE: After producing the native implementation-readiness report (docs/planning/implementation-readiness-report-*.md), create the methodology record docs/development/IR-<sira>.md according to rule §2.5a in {metodoloji-root}/docs/bmad/dev-skill-to-methodology-bridge.md. Copy the {metodoloji-root}/templates/_template_IR.md template, fill the fields from the native report with English labels (Date, Status: preparing|READY|INCOMPLETE, Research inputs, Design documents, Success criteria, Technical dependencies, Risk assessment, Gaps, Decision: READY|INCOMPLETE + rationale, Next step: proceed to sprint planning|return to research). Add the reference 'Methodology record: docs/development/IR-<sira>.md' to the native report. The Decision field must be READY or INCOMPLETE and the Date field must be present (scripts/check-methodology.sh §6 checks this). This does not break the BMAD native flow; it adds the methodology record alongside it and establishes the record chain (E → IR → SP). VERIFY: After creating the record, run 'ls -la docs/development/IR-<sira>.md' in the terminal. If the file is missing, error and recreate the record.",
]

# Persistent facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "All artifacts must follow org naming conventions."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
  "file:{metodoloji-root}/docs/bmad/development-methodology.md",
]

# Scalar: executed when the workflow reaches Step 6 (Final Assessment),
# after the readiness report has been saved and presented. Override wins.
# Leave empty for no custom post-completion behavior.

on_complete = ""
