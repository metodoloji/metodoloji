# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for bmad-forge-idea.
#
# Override files (not edited here):
#   {project-root}/custom/bmad-forge-idea.toml        (team)
#   {project-root}/custom/bmad-forge-idea.user.toml   (personal)

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays: append

# Steps to run before the standard activation (config load, greet).
activation_steps_prepend = []

# Steps to run after greet but before the session begins.
activation_steps_append = [
  "Before starting this work, verify the gate rules of the relevant module in the methodology manifesto ({metodoloji-root}/docs/bmad/research-methodology.md): the evidence type and record format of the output to be produced.",
  "Before finishing the work, verify that the record is complete: English field labels, decision rationale, uncertainty acknowledgment. A documentary decision is not permission to write code.",
  "PROACTIVE TRIGGERING: If the user shares a half-formed idea (I have an idea, I'm thinking of something like this, I have an idea), do not wait for a forge command — engage immediately. Do not only ask questions; first present your reading of the idea: what is promising, what is broken, what it implies. Propose a concrete hypothesis so the user can accept/reject/revise it.",
  "EXPLICIT DECISION: As soon as a branch implies a choice the user has not yet made, name that choice explicitly and ask for their decision: 'let's clarify this decision: X or Y?'. Do not let ambiguous terms pass — if user/buyer/payer are not the same entity, distinguish them. Every resolved branch must end in a concrete decision the user can build on.",
  "ONE QUESTION AT A TIME: Do not ask five questions at once. Ask one question in dependency order, pause when a branch is resolved, and give the user the chance to voice their remaining concern.",
]

# Persistent facts the interrogator keeps in mind for the whole session
# (domain constraints, house rules, what's off the table). Each entry is a
# literal sentence, a skill prefixed with `skill:`, or a `file:`-prefixed
# path/glob whose contents are loaded as facts. Default loads project-context.md
# when one exists (e.g. from bmad-generate-project-context), so the forge grounds
# in the project's tech, domain, and constraints without re-asking.
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
]

# Executed when the session completes. Scalar or array of instructions. Empty for none.
on_complete = []

# Parent folder for all forge sessions. Each session gets its own run
# folder underneath (see run_folder_pattern). Lands directly under
# {output_folder} so the forge works in core-only installs.
forge_output_path = "{output_folder}/forge"

# Run-folder pattern inside forge_output_path. Resolved against the
# idea-derived slug at activation. Same slug = same folder, so resuming
# an idea reuses its workspace. Override to add {date} or other components
# if a fresh dated history per run is preferred.
run_folder_pattern = "{slug}"
