# BMad research experiment workflow customization surface.

[workflow]

# Steps to run before the standard activation (config load, greet).
activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
activation_steps_append = [
  "Confirm the methodology manifesto is loaded: read {metodoloji-root}/docs/bmad/research-methodology.md if present. If it is missing, stop and tell the user the skill requires the manifesto; offer to create it.",
  "At Stage 6 (Result), after the record is written and the decision is made, confirm to the user that the experiment record exists under docs/experiments/, restate the decision (APPROVED / REJECTED) with the measured value, and state the next step: approved → Code phase; rejected → Return to Theory (new experiment).",
]

# Persistent facts the workflow keeps in mind for the whole run.
# The manifesto IS the methodology: it is loaded on every activation.
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
  "file:{metodoloji-root}/docs/bmad/development-methodology.md",
]
