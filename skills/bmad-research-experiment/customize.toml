# BMad research experiment workflow customization surface.

[workflow]

# Steps to run before the standard activation (config load, greet).
activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
activation_steps_append = [
  "Confirm the chain spec is loaded: read {metodoloji-root}/hooks/workflow/builtin/methodology-chain.json if present. If it is missing, stop and tell the user this installation is broken; offer to reinstall the plugin.",
  "At Stage 6 (Result), after the record is written and the decision is made, confirm to the user that the experiment record exists under docs/experiments/, restate the decision (APPROVED / REJECTED) with the measured value, and state the next step: approved → Code phase; rejected → Return to Theory (new experiment).",
  "Before starting this work, verify the gate rules of the relevant stage in the chain spec ({metodoloji-root}/hooks/workflow/builtin/methodology-chain.json): the evidence type and record format of the output to be produced.",
  "Before finishing the work, verify that the record is complete: English field labels, decision rationale, uncertainty acknowledgment. A documentary decision is not permission to write code.",
]

# Persistent facts the workflow keeps in mind for the whole run.
# The chain spec IS the methodology: it is loaded on every activation.
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/hooks/workflow/builtin/methodology-chain.json",
]
