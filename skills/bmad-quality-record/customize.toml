# bmad-quality-record customization template
# Team and personal overrides go in:
#   {project-root}/custom/bmad-quality-record.toml (team)
#   {project-root}/custom/bmad-quality-record.user.toml (personal)

[workflow]
# Pre-activation steps (run before main workflow)
activation_steps_prepend = [
  "Confirm the methodology manifesto is loaded: read {metodoloji-root}/docs/bmad/research-methodology.md if present. If it is missing, stop and tell the user this workflow requires it.",
]

# Persistent facts (loaded at start, carried through workflow)
persistent_facts = [
  "QR records are Gate 3 of the methodology chain E→IR→SP→S→QR→PR",
  "QR must verify all AC (acceptance criteria) from the story",
  "QR must verify all DoD (definition of done) from the story",
  "QR requires code review approval before APPROVED decision",
  "Mechanical checks (tests, security, linter) are mandatory",
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
  "file:{metodoloji-root}/docs/bmad/development-methodology.md",
]

# Post-activation steps (run after main workflow)
activation_steps_append = [
  "For each AC under verification, check its Experiment (E-XXX) reference in the story. ACs with Experiment=— or a PENDING/REJECTED experiment are [HYPOTHESIS] items: record them as unverified in the QR rather than PASS/FAIL, and direct the user to bmad-research-experiment to close the gap.",
]

# Post-completion action (optional terminal command)
on_complete = ""

[template]
# QR file naming convention
qr_id_format = "QR-{number:03d}"
# Where to look for next available ID
qr_next_id_query = "{quality_location}/QR-*.md"

[gates]
# Gate 3 requirements
test_coverage_threshold = 80
code_review_required = true
ac_verification_required = true
dod_verification_required = true
documentation_required = true

# Status values allowed for QR
allowed_statuses = ["in-review", "APPROVED", "REJECTED", "REVISED"]
