  "KERNEL: Once the S record is at review, advance its run: `python3 {metodoloji-root}/hooks/scripts/workflow.py complete --slug S-<sira> --stage story --project-root {project-root}`. Autonomous mode stops at a refusal instead of forcing past it.",
  "Before implementing any feature, resolve its measured basis from the work item's metadata (story AC metadata / frontmatter `experiment_refs`) — never invent an id. For an E-XXX reference run `python3 {metodoloji-root}/skills/bmad-research-experiment/scripts/run_experiment.py --verify --record {project-root}/docs/experiments/<id>.md` and require VERIFIED (contract records verify the same way). FORGED or REJECTED means no code — stop and request a valid approved experiment record. For a STRUCT-XXX reference require docs/development/structural/STRUCT-XXX.md with Status declared|ratified, a >= 40-character justification and a Scope glob covering the touched files; never run run_experiment.py on it. Work with no approved basis (a [HYPOTHESIS]) has NO code-writing permission: leave it as a note and never implement it. When nothing in the work item has an approved basis, implement nothing, report the missing approval, and stop.",
  "TASK↔AC DYNAMIC VALIDATION: Check whether each Technical Task has a reference (AC: AC-XXX). If a reference is missing, inform the user before implementation and have it corrected.",
