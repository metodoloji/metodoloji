# bmad-production-readiness customization template
# Team and personal overrides go in:
#   {project-root}/custom/bmad-production-readiness.toml (team)
#   {project-root}/custom/bmad-production-readiness.user.toml (personal)

[workflow]
# Pre-activation steps (run before main workflow)
activation_steps_prepend = [
  "Confirm the chain spec is loaded: read {metodoloji-root}/hooks/workflow/builtin/methodology-chain.json if present. If it is missing, stop and tell the user this workflow requires it.",
]

# Persistent facts (loaded at start, carried through workflow)
persistent_facts = [
  "PR records are Gate 4 of the methodology chain E→IR→SP→S→QR→PR",
  "PR must verify all approved QRs are in release scope",
  "PR requires staging deployment and smoke tests",
  "PR requires rollback plan and preferably rollback testing",
  "PR requires monitoring, alerting, and runbook before production deploy",
  "Deployment cannot proceed without PR READY status",
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/hooks/workflow/builtin/methodology-chain.json",
]

# Post-activation steps (run after main workflow)
activation_steps_append = [
  "KERNEL: The deploy branch is declared BEFORE quality-review completes — by bmad-quality-record / bmad-code-review, from the QR's Next step. Check where the run stands: `python3 {metodoloji-root}/hooks/scripts/workflow.py status --slug S-<sira> --project-root {project-root}`. At stage `production-readiness`, advance it once the PR record is ready/deployed: `python3 {metodoloji-root}/hooks/scripts/workflow.py complete --slug S-<sira> --stage production-readiness --project-root {project-root}`. A run already `completed` means the branch was never declared: say so plainly — the PR record still stands on its own, but the kernel run did not pass through this stage, and it cannot be reopened from here (re-drive it with `create --force` only if the chain itself must be re-proven).",
  "This record is required only for Rigor Tier 3. Read the story's `- **Rigor Tier:**`; Tier 1/2 skip the PR record by policy (the deploy guard's min_tier=3) and their tier declaration alone proves the production-readiness stage.",
  "Link every PR item to its quality record (QR-XXX) under docs/quality/ whose status is APPROVED. Quality claims without an approved, measured QR are marked as unverified — do not certify them as production-ready.",
]

# Post-completion action (optional terminal command)
on_complete = ""

[template]
# PR file naming convention
pr_id_format = "PR-{number:03d}"
# Where to look for next available ID
pr_next_id_query = "{deployment_location}/PR-*.md"

[gates]
# Gate 4 requirements
staging_test_required = true
rollback_plan_required = true
monitoring_required = true
runbook_required = true
change_approval_required = true

# Status values allowed for PR
allowed_statuses = ["preparing", "ready", "deployed", "rolled-back"]
# Decision values allowed for PR (separate from Status)
allowed_decisions = ["READY", "WAITING"]

[deploy]
# Default deployment method (can be overridden)
default_deploy_method = "CI/CD pipeline"

# Rollback strategies available
rollback_strategies = ["blue-green", "rolling", "instant", "canary"]

# Monitoring defaults
default_metric_retention_days = 30
critical_alert_sla_minutes = 5
major_alert_sla_hours = 4
minor_alert_sla_days = 1

# Feature flag defaults
supports_feature_flags = true
canary_rollout_default_percent = 10
