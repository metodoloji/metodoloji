  "Rigor Tier 1 needs QR + regression evidence; Tier 2 adds AC metadata and unit tests; Tier 3 keeps the full chain. STRUCT-XXX is declared work, not a hypothesis; a contract is an E record with Record Kind: contract.",
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/hooks/workflow/builtin/methodology-chain.json",
]

