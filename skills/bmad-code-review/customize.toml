activation_steps_append = [
  "KERNEL: Declare the release branch before you advance the run — if this release will be deployed (the QR's Next step is 'plan deploy'), set it first: `python3 {metodoloji-root}/hooks/scripts/workflow.py flag --slug S-<sira> --key deploy --value true --project-root {project-root}`. The deploy branch is read when quality-review completes, so a flag set after that cannot reopen the run. Then advance: `python3 {metodoloji-root}/hooks/scripts/workflow.py complete --slug S-<sira> --stage quality-review --project-root {project-root}`. The kernel verifies the QR declares this story and its table is coherent; a refusal names the gap.",
  "Before starting this work, verify the gate rules of the relevant stage in the chain spec ({metodoloji-root}/hooks/workflow/builtin/methodology-chain.json): the evidence type and record format of the output to be produced.",
  "Before finishing the work, verify that the record is complete: English field labels, decision rationale, uncertainty acknowledgment. A documentary decision is not permission to write code; code always requires an APPROVED experiment (never REJECTED or PENDING).",
  "BRIDGE (QR ownership): After the native code review is complete, author or update the ONE methodology record docs/quality/QR-<sequence>.md (next available numeric id). Search by the record's `Story:` field first: if a QR for this story exists, UPDATE it in place; create from {metodoloji-root}/templates/_template_QR.md only when absent. Never write a second QR for the same story. Fill the fields with English labels (Date, Status: in-review|APPROVED|REJECTED|REVISED, Story S-id reference, PR/MR, Mechanical checks: test coverage/test result/lint/security scan/performance, Code review: reviewers + comments + approval, Documentation, If technical debt was added, also add it to tech-debt.md, Decision: APPROVED|REJECTED|REVISED + rationale, Next step: merge|revise|plan deploy). Comment-only observations belong in the rationale, not in Status; `pass|fail|partial` is not a valid vocabulary and the commit gate reads `Status: APPROVED`. Add the reference 'Methodology record: docs/quality/QR-<sequence>.md' to the native review output. Read the story's `- **Rigor Tier:**`: Tier 1 needs the QR + regression evidence, Tier 2 adds AC metadata and unit tests, Tier 3 keeps the full chain. A STRUCT-XXX AC is DECLARED work: verify docs/development/structural/STRUCT-XXX.md (Status declared|ratified, justification >= 40 chars, Scope glob) and fill its `Reviewed-By: QR-<sequence>`; a declaration that now covers code with real claims is a High finding. VERIFY: run 'ls -la docs/quality/QR-<sequence>.md'; if the record is missing, error and recreate the record. On APPROVED, post the chain baton: `python3 {metodoloji-root}/hooks/scripts/blackboard.py mirror --key QR-<sequence> --value \"APPROVED for S-XXX — record: docs/quality/QR-<sequence>.md\" --to bmad-production-readiness --note \"QR approved, Rigor Tier 3 — production readiness\" --project-root {project-root}` for Tier 3; for Tier 1/2 omit `--to` (no PR record by policy).",
