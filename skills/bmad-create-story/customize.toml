[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = [
  "Confirm the chain spec is loaded: read {metodoloji-root}/hooks/workflow/builtin/methodology-chain.json if present. If it is missing, stop and tell the user this workflow requires it.",
]

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = [
  "RIGOR TIER (required field): Write `- **Rigor Tier:** 1|2|3` in the S record and the native story. Choose by blast radius: 1 = trivial/doc/hotfix (QR + regression evidence; no experiment ref required), 2 = feature/refactor (story record, AC metadata, unit tests; planning records skipped), 3 = probabilistic/security/core/ML (full E → IR → SP → S chain). Absent or malformed falls back to Tier 3. The tier decides which chain records are required — never pick it to avoid work.",
  "KERNEL: After the S record exists, open its run with `python3 {metodoloji-root}/hooks/scripts/workflow.py create --builtin methodology-chain --slug S-<sira> --flag tier=3 --project-root {project-root}`, replacing the digit 3 with the S record's own `- **Rigor Tier:**` value (1, 2 or 3). Pass a bare digit: an alternation or angle brackets are read by the shell as a pipe and a redirect, and the run is created with a tier no edge matches. Then advance ONE stage at a time: ask `python3 {metodoloji-root}/hooks/scripts/workflow.py next --slug S-<sira> --project-root {project-root}`, produce the evidence the reported stage names, and call `complete` with the same `--slug` and `--project-root` plus `--stage` set to the reported id. Tier 3 order is experiment, implementation-readiness, sprint-planning, story; Tier 1/2 skips the planning records, so its order is experiment, story. The kernel refuses any stage that is not current, so never batch ids and never pass --force; a refusal names the missing record and its owner — produce it.",
  "Link every story to its measured basis: an APPROVED experiment (`Experiment: E-XXX`, or an E record declaring `Record Kind: contract` for a deterministic closed-set test) or a Structural Scope declaration (`Experiment: STRUCT-XXX`, docs/development/structural/, Status declared|ratified). If an acceptance criterion implies a falsifiable claim without either, mark it [HYPOTHESIS] — do not assert it as fact, and never invent an experiment to unlock scaffold code.",
  "AC METADATA REQUIREMENT: Fill in the following fields for each Acceptance Criterion: [AC-XXX] identifier, Experiment (E-XXX | STRUCT-XXX | —), Type (agent-verifiable|user-evaluable|hybrid), Measured (true|false), Verify (validation method). Missing metadata = the story cannot be validated. In ACs where Experiment=—, the [HYPOTHESIS] label is required. STRUCT-XXX is declared work, not a hypothesis: it needs no [HYPOTHESIS] tag.",
  "TASK↔AC MATCHING: Each Technical Task must reference (AC: AC-XXX). A task without an AC reference = a validation warning. The guard hook verifies this matching.",
  "DoD STRUCTURAL CHECK: Each Definition of Done item must have a [DoD-XXX] identifier and a Verify field. Items related to an AC require an AC: AC-XXX reference.",
  "BRIDGE: After producing the native story file ({implementation_artifacts}/<story-key>.md), create the methodology record docs/development/stories/S-<sira>.md from {metodoloji-root}/templates/_template_S.md: fill the fields from the native story with English labels (Date, Status: backlog|ready-for-dev|in-progress|review|done|blocked, Story title, Epic, Sprint reference, User Story: in 'As a [role], I want [action], so that [value]' format, Acceptance criteria, Technical Tasks: each task referenced (AC: AC-XXX), Definition of Done: each item [DoD-XXX] + Verify, Dependencies: S-ids this story depends on / that depend on it, API and infrastructure dependencies, Research inputs: E/R/D/C-id references, File list, Experiment Refs). Add the reference 'Methodology record: docs/development/stories/S-<sira>.md' to the native story file. Check the measured basis for each AC: is experiment_refs defined in the frontmatter? Is the status APPROVED (or the STRUCT declaration on disk)? Mark E-ACs that are PENDING or REJECTED as [HYPOTHESIS] in the story file; keep STRUCT-ACs declared. This does not break the BMAD native flow; it adds the methodology record alongside it and establishes the record chain (SP → S → implementation). VERIFY: After creating the record, run 'ls -la docs/development/stories/S-<sira>.md' in the terminal. If the file is missing, error and recreate the record.",
]

# Persistent facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "All stories must include testable acceptance criteria."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = [
  "Rigor Tier 1 = QR + regression evidence; Tier 2 adds the story record, AC metadata and unit tests; Tier 3 keeps the full E → IR → SP → S chain. Every tier still requires its QR. Absent/malformed tier falls back to 3.",
  "Code with no measurable claim is declared in docs/development/structural/STRUCT-NNN.md (justification >= 40 chars + scope glob + Status: declared|ratified), never forced through a fake experiment.",
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/hooks/workflow/builtin/methodology-chain.json",
]

# Scalar: executed when the workflow reaches Step 6 (Update sprint status and finalize),
