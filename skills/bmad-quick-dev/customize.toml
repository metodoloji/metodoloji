# DO NOT EDIT -- overwritten on every update.
#
# Default customization values for bmad-quick-dev.
# Override in {project-root}/custom/bmad-quick-dev.toml or
# {project-root}/custom/bmad-quick-dev.user.toml.
#
# Merge rules:
# - Strings replace the default.
# - Lists append to the default list.
# - Tables merge key by key.

[workflow]

# Extra instructions to run before config is loaded and before the user is greeted.

activation_steps_prepend = [
  "Confirm the chain spec is loaded: read {metodoloji-root}/hooks/workflow/builtin/methodology-chain.json if present. If it is missing, stop and tell the user this workflow requires it.",
]

# Extra instructions to run after the greeting and before step 01.

activation_steps_append = [
  "KERNEL: Once the S record is at review, advance its run: `python3 {metodoloji-root}/hooks/scripts/workflow.py complete --slug S-<sira> --stage story --project-root {project-root}`; quick code does not skip the kernel's own check.",
  "Before implementing any feature, resolve its measured basis from the work item's metadata (story AC metadata / frontmatter `experiment_refs`) — never invent an id. For an E-XXX reference run `python3 {metodoloji-root}/skills/bmad-research-experiment/scripts/run_experiment.py --verify --record {project-root}/docs/experiments/<id>.md` and require VERIFIED (contract records verify the same way). FORGED or REJECTED means no code — stop and request a valid approved experiment record. For a STRUCT-XXX reference require docs/development/structural/STRUCT-XXX.md with Status declared|ratified, a >= 40-character justification and a Scope glob covering the touched files; never run run_experiment.py on it. Work with no approved basis (a [HYPOTHESIS]) has NO code-writing permission: leave it as a note and never implement it. When nothing in the work item has an approved basis, implement nothing, report the missing approval, and stop.",
  "TASK↔AC DYNAMIC VALIDATION: Check whether each Technical Task has a reference (AC: AC-XXX). If a reference is missing, inform the user before implementation and have it corrected.",
  "BRIDGE: After the implementation is complete, update the Status field of the record docs/development/stories/S-<sira>.md (fields per {metodoloji-root}/templates/_template_S.md) from 'in-progress' → 'review', and fill in the Dev Agent Record sections. Even with quick code, you must preserve the methodology record chain (S → QR → PR) — no leaving things off the record. If you change the native story file, sync the methodology record too. VERIFICATION: After updating the story record, run 'ls -la docs/development/stories/S-<sira>.md' in the terminal. If the file is missing, raise an ERROR and recreate the record.",
  "BRIDGE (QR ownership): Do NOT author the QR here. Set the story/work item to review and hand off to bmad-code-review; the single QR record docs/quality/QR-<sequence>.md (next available numeric id) is authored by bmad-code-review / bmad-quality-record with Status in-review|APPROVED|REJECTED|REVISED after review. `QR Status: pass|fail|partial` is not a gate-readable status.",
  "BRIDGE (deploy readiness): Do NOT author the PR here. Read the work item's `- **Rigor Tier:**`: Tier 1/2 skip the PR record by policy; Tier 3 hands off to bmad-production-readiness once the QR is APPROVED. Only that skill writes docs/development/PR-<id>.md (Status preparing|ready|deployed|rolled-back; Decision READY|WAITING).",
]

# Facts kept in context for the whole run.
# Entries are literal text or file references prefixed with "file:".
# File entries may use globs and are loaded during activation.

persistent_facts = [
  "Rigor Tier 1/2 skip the PR record by policy; every tier requires its QR. Tier is read from the story's own `- **Rigor Tier:**` field.",
  "STRUCT-XXX is a declared structural scope, not an experiment: verify docs/development/structural/STRUCT-XXX.md (Status declared|ratified, justification >= 40 chars, Scope glob) and never run run_experiment.py on it.",
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/hooks/workflow/builtin/methodology-chain.json",
]

# Instruction run after Quick Dev completes.
# Empty means no extra completion behavior.

on_complete = ""
