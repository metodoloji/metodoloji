# Team overrides for bmad-create-story — Research methodology (Mod C: story file ready for implementation).
# A story is the unit handed to the Code phase. It must trace to an approved experiment and may
# not invent measurements for its acceptance criteria.
# This workflow is directly invocable (/bmad-create-story), independent of the analyst agent.

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
  "file:{metodoloji-root}/docs/bmad/development-methodology.md",
]
activation_steps_prepend = [
  "Confirm the methodology manifesto is loaded: read {metodoloji-root}/docs/bmad/research-methodology.md if present. If it is missing, stop and tell the user this workflow requires it.",
]
activation_steps_append = [
  "Link every story to its experiment record under docs/experiments/ whose status is APPROVED. If a story's acceptance criteria imply a falsifiable claim without a measured, approved experiment, mark that criterion as a hypothesis awaiting experiment — do not assert it as fact.",
  "AC METADATA REQUIREMENT: Fill in the following fields for each Acceptance Criterion: [AC-XXX] identifier, Experiment (E-XXX or —), Type (agent-verifiable|user-evaluable|hybrid), Measured (true|false), Verify (validation method). Missing metadata = the story cannot be validated. In ACs where Experiment=—, the [HYPOTHESIS] label is required.",
  "TASK↔AC MATCHING: Each Technical Task must reference (AC: AC-XXX). A task without an AC reference = a validation warning. The guard hook verifies this matching.",
  "DoD STRUCTURAL CHECK: Each Definition of Done item must have a [DoD-XXX] identifier and a Verify field. Items related to an AC require an AC: AC-XXX reference.",
  "BRIDGE: After producing the native story file ({implementation_artifacts}/<story-key>.md), create the methodology record docs/development/stories/S-<sira>.md according to rule §2.3 of {metodoloji-root}/docs/bmad/dev-skill-to-methodology-bridge.md. Copy the template from {metodoloji-root}/templates/_template_S.md, fill the fields from the native story with English labels (Date, Status: backlog|sprint|in-progress|review|done|blocked, Story title, Epic, Sprint reference, User Story: in 'As a [role], I want [action], so that [value]' format, Acceptance criteria, Technical Tasks: each task referenced (AC: AC-XXX), Definition of Done: each item [DoD-XXX] + Verify, Dependencies: S-ids this story depends on / that depend on it, API and infrastructure dependencies, Research inputs: E/R/D/C-id references, File list, Experiment Refs). Add the reference 'Methodology record: docs/development/stories/S-<sira>.md' to the native story file. Check the experiment link for each AC: is experiment_refs defined in the frontmatter? Is the status APPROVED? Mark ACs that are PENDING or REJECTED as [HYPOTHESIS] in the story file. This does not break the BMAD native flow; it adds the methodology record alongside it and establishes the record chain (SP → S → implementation). VERIFY: After creating the record, run 'ls -la docs/development/stories/S-<sira>.md' in the terminal. If the file is missing, error and recreate the record."
]
