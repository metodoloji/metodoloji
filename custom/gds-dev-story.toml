# Team overrides for gds-dev-story -- Research methodology (Mod A -> Code: game implementation (mechanical approval required)).
# This workflow writes story code directly. It must load the manifesto and require a
# verified experiment approval before implementing, exactly like bmad-dev-story.
# Without this, invoking /gds-dev-story directly would bypass the methodology gate.

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
  "file:{metodoloji-root}/docs/bmad/development-methodology.md",
]
activation_steps_append = [
  "Before implementing any story, verify its experiment approval: run `python3 {metodoloji-root}/skills/bmad-research-experiment/scripts/run_experiment.py --verify --record {project-root}/docs/experiments/<deney-id>.md` and require the VERIFIED output. FORGED or REJECTED means no code — stop and request a valid approved experiment record.",
  "Before starting this work, verify the gate rules of the relevant module in the methodology manifesto ({metodoloji-root}/docs/bmad/research-methodology.md): the evidence type and record format of the output to be produced.",
  "Before finishing the work, verify that the record is complete: English field labels, decision rationale, uncertainty acknowledgment. A documentary decision is not permission to write code.",
  "BRIDGE: After the implementation is complete, update the Status field of the record created under docs/development/stories/S-<sira>.md according to rule §2.4 of {metodoloji-root}/docs/bmad/dev-skill-to-methodology-bridge.md from 'in-progress' → 'review', and fill in the Dev Agent Record (Debug Log, Completion Notes, File List, Change Log) sections. Add the applied experiment results to the Experiment Refs field. This record is the link to the QR record of the code review, the next step (record chain: S → QR). If you change the native story file, sync the methodology record to reflect the same update.",
  "BRIDGE #3 (QR): After implementation and DoD verification are complete, create the QR record according to rule §2.5 of {metodoloji-root}/docs/bmad/dev-skill-to-methodology-bridge.md: create docs/quality/QR-<sira>.md, fill in status/evidence/date for each DoD item, and update the Quality Record section in the story file. Record chain: S → QR → PR. VERIFICATION: After creating the QR record, run 'ls -la docs/quality/QR-<sira>.md' in the terminal. If the file is missing, raise an ERROR and recreate the record.",
  "BRIDGE (PR): Before deploy, create the production readiness record docs/development/PR-<sira>.md (bridge §2.6): copy the templates/_template_PR.md template, fill it with English labels (Date, Status: preparing|READY|PENDING, Release type, Version, Release scope: QR-id list, Staging Test, Rollback Plan, Monitoring, Feature Flags, Runbook, Incident Response, Decision: READY|PENDING + rationale, Next step: production deploy|complete the gaps). Decision from allowed values, Date required (check-methodology §6). The record chain QR → PR is completed, satisfying the deploy guard's Gate 4 enforcement. VERIFICATION: run ls -la docs/development/PR-<sira>.md; if missing, raise an ERROR."
]
on_complete = "Chain close-out (single call): `python3 {metodoloji-root}/bmad/scripts/blackboard.py mirror --key gds.dev.<story-slug> --value \"implementation complete\" --to gds-code-review --note \"implementation ready — the downstream session opens knowing this landed\" --project-root {project-root}`. The run key is this run's heartbeat; repeating the same mirror never duplicates the waiting signal."
