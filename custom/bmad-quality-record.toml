# Team overrides for bmad-quality-record — Research methodology (Mod C: QR record, Gate 3).
# A QR record verifies a story's acceptance criteria mechanically. Criteria labeled [HYPOTHESIS]
# in the story require an approved, measured experiment before they can pass — a hypothesis is
# never verified by assertion. This workflow is directly invocable (/bmad-quality-record),
# independent of the analyst agent.

[workflow]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
  "file:{metodoloji-root}/docs/bmad/development-methodology.md",
]
activation_steps_prepend = [
  "Confirm the methodology manifesto is loaded: read {metodoloji-root}/docs/bmad/research-methodology.md if present. If it is missing, stop and tell the user this workflow requires it.",
]
activation_steps_append = [
  "For each AC under verification, check its Experiment (E-XXX) reference in the story. ACs with Experiment=— or a PENDING/REJECTED experiment are [HYPOTHESIS] items: record them as unverified in the QR rather than PASS/FAIL, and direct the user to bmad-research-experiment to close the gap.",
]
