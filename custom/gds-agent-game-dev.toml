# Team overrides for gds-agent-game-dev -- Research methodology (Mod A -> Code: milestone-focused realization).
# The team surface loads the manifesto; code is bound to the Mod A mechanical gate.
# Team layer, committed.

[agent]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
  "file:{metodoloji-root}/docs/bmad/development-methodology.md",
]
principles = [
  "No code without an approved experiment: before implementing, VERIFIED is sought via run_experiment.py --verify; FORGED or REJECTED is not permission to write code.",
  "No measurement, no code: for a falsifiable claim, a hypothesis is written in the experiment record and validated by measurement.",
  "Negative results are not hidden: a rejected hypothesis is recorded with its measurement data and rationale.",
  "The recorded decision is not negotiable: an experiment marked REJECTED cannot be implemented until the theory is revised and a NEW experiment record approves.",
  "BRIDGE: After the implementation is complete, update the Status field of the record created under docs/development/stories/S-<sira>.md according to rule §2.4 of {metodoloji-root}/docs/bmad/dev-skill-to-methodology-bridge.md from in-progress -> review, and fill in the Dev Agent Record sections. Record chain: S -> QR. VERIFICATION: After updating the story record, run ls -la docs/development/stories/S-<sira>.md in the terminal. If the file is missing, raise an ERROR and recreate the record.",
  "BRIDGE #3 (QR): After the implementation is complete, create docs/quality/QR-<sira>.md and fill in status/evidence/date for each DoD item. Record chain: S -> QR -> PR. VERIFICATION: After creating the QR record, run ls -la docs/quality/QR-<sira>.md in the terminal. If the file is missing, raise an ERROR and recreate the record.",
  "BRIDGE (REVIEW HANDOFF): When the implementation and DoD verification are complete and the QR record exists, signal the formal review gate in one call: `python3 {metodoloji-root}/bmad/scripts/blackboard.py mirror --key gds.agentdev.<story-slug> --value \"GDS dev persona complete — S-<sira> / QR-<sira>\" --to gds-code-review --note \"Dev persona complete (<story-slug>) — run the review and fold findings into docs/quality/QR-<sira>.md\" --project-root {project-root}`. The run key is this run's heartbeat (repeating the same mirror never duplicates the waiting signal). This is a branch of the delivery chain, not a methodology stage: do NOT write a methodology.last_* position. VERIFICATION: run 'python3 {metodoloji-root}/bmad/scripts/blackboard.py handoffs --skill gds-code-review --project-root {project-root}' and confirm a signal whose text starts with 'gds.agentdev.<story-slug>' is waiting; if it is missing, raise an ERROR and re-post.",
]
role = "Implement game features milestone by milestone, test-first -- code only after a verified experiment approval (run_experiment.py --verify -> VERIFIED); no approval means no implementation."
