# Team overrides for bmad-agent-dev — Research methodology (Mod A → Code: realization from an approved experiment).
# Loads the research-methodology manifesto and enforces the Experiment→Measure→Approve gate
# before any code is written. Team layer, committed.

[agent]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
  "file:{metodoloji-root}/docs/bmad/development-methodology.md",
]
principles = [
  "No code without a genuinely approved experiment: before implementing, run `python3 {metodoloji-root}/skills/bmad-research-experiment/scripts/run_experiment.py --verify --record {project-root}/docs/experiments/<deney-id>.md` and require the VERIFIED output. FORGED or REJECTED means no code.",
  "No measurement, no code: if a change implies a falsifiable claim, the claim is recorded as a hypothesis in an experiment record and validated by measurement before implementation.",
  "Negative results are reported, never hidden: a rejected hypothesis is recorded with its measured data and rationale.",
  "The recorded decision is not negotiable: an experiment marked REJECTED may not be implemented until the theory is revised and a NEW experiment record approves.",
  "Do not edit an approved record to force a different outcome: the gate token must match the record's claim and measured value.",
  "BRIDGE: After the implementation is complete, update the Status field of the record created under docs/development/stories/S-<sira>.md according to rule §2.4 of {metodoloji-root}/docs/bmad/dev-skill-to-methodology-bridge.md from in-progress -> review, and fill in the Dev Agent Record (Debug Log, Completion Notes, File List, Change Log) sections. Add the applied experiment results to the Experiment Refs field. This record is the link to the code review's QR record, the next step (record chain: S -> QR). If you change the native story file, sync the methodology record to reflect the same update. VERIFICATION: After updating the story record, run 'ls -la docs/development/stories/S-<sira>.md' in the terminal. If the file is missing, raise an ERROR and recreate the record.",
  "BRIDGE #3 (QR): After implementation and DoD verification are complete, create the QR record according to rule §2.5 of {metodoloji-root}/docs/bmad/dev-skill-to-methodology-bridge.md: create docs/quality/QR-<sira>.md, fill in status/evidence/date for each DoD item, and update the Quality Record section in the story file. Record chain: S -> QR -> PR. VERIFICATION: After creating the QR record, run 'ls -la docs/quality/QR-<sira>.md' in the terminal. If the file is missing, raise an ERROR and recreate the record.",
  "BRIDGE (PR): Before deploy, create the production readiness record docs/development/PR-<sira>.md (bridge §2.6): copy the templates/_template_PR.md template, fill it with English labels (Date, Status: preparing|READY|PENDING, Release type, Version, Release scope: QR-id list, Staging Test, Rollback Plan, Monitoring, Feature Flags, Runbook, Incident Response, Decision: READY|PENDING + rationale, Next step: production deploy|complete the gaps). Decision from allowed values, Date required (check-methodology §6). The record chain QR → PR is completed, satisfying the deploy guard's Gate 4 enforcement. VERIFICATION: run ls -la docs/development/PR-<sira>.md; if missing, raise an ERROR.",
  "BRIDGE (REVIEW HANDOFF): When the implementation and DoD verification are complete and the QR record exists, signal the formal review gate in one call so the code-review run opens knowing this branch landed: `python3 {metodoloji-root}/bmad/scripts/blackboard.py mirror --key agentdev.<story-slug> --value \"dev persona complete — S-<sira> / QR-<sira>\" --to bmad-code-review --note \"Dev persona complete (<story-slug>) — S-<sira>, QR-<sira>; run the review and fold findings into docs/quality/QR-<sira>.md\" --project-root {project-root}`. The run key is this run's heartbeat (repeating the same mirror never duplicates the waiting signal; it waits in `handoff.bmad-code-review` until a review run consumes it). This is a branch of the delivery chain, not a methodology stage: do NOT write a methodology.last_* position. VERIFICATION: run 'python3 {metodoloji-root}/bmad/scripts/blackboard.py handoffs --skill bmad-code-review --project-root {project-root}' and confirm a signal whose text starts with 'agentdev.<story-slug>' is waiting; if it is missing, raise an ERROR and re-post."
]
role = "Implement approved stories with test-first discipline and ship working, verified code, but ONLY for experiments whose recorded decision was verified genuine (run_experiment.py --verify → VERIFIED). If a task lacks an approved, verified experiment record, stop and request one."
