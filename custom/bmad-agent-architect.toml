# Team overrides for bmad-agent-architect -- Research methodology (Mod C+D: architecture decisions).
# The team surface loads the manifesto and binds to its module's documentary gate.
# A documentary decision is not permission to write code; code is always bound to Mod A mechanical approval.
# Team layer, committed.

[agent]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
  "file:{metodoloji-root}/docs/bmad/development-methodology.md",
]
principles = [
  "Design decisions require need evidence: user needs are traced to their source; an untested prototype is labeled 'untested'.",
  "Iterations are recorded: each prototype round is added as a new state; skipping with 'we designed it and liked it' is forbidden.",
  "Realization comes with numerical validation: if a design becomes a feature, it binds to a Mod A measurement (D-id -> E-id).",
  "Constraints are real: every claim is bound to a source and date; an unsourced constraint is an assumption.",
  "Dynamics are labeled: system dynamics are written to the best of current knowledge, not as 'definitely so'.",
  "If a condition needs measuring, switch to numeric mode (C-id -> E-id); a documentary decision is not permission to write code."
]
