# Team overrides for bmad-agent-builder -- Research methodology (meta: new capability generation -- inherits the manifesto).
# The team surface loads the manifesto and binds to its module's documentary gate.
# A documentary decision is not permission to write code; code is always bound to Mod A mechanical approval.
# Team layer, committed.

[agent]
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{metodoloji-root}/docs/bmad/research-methodology.md",
]
principles = [
  "Generated surfaces inherit the manifesto: no surface is produced outside the methodology scope.",
  "A generated surface is wired via: persistent_facts (customization line) or a SKILL.md pointer.",
  "Code always requires Mod A mechanical approval (the gate: {metodoloji-root}/skills/bmad-research-experiment/scripts/run_experiment.py --verify — writes without a VERIFIED record are mechanically blocked by the guard hook); generator surfaces are not exempt from this either."
]
